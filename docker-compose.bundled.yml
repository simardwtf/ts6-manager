# docker-compose.bundled.yml
# ─────────────────────────────────────────────────────────────────────────────
# All-in-one zero-config stack: TeamSpeak 6 server + TS6 Manager.
#
#   git clone <this-repo>
#   cd ts6-manager
#   docker compose -f docker-compose.bundled.yml up -d
#
# That's it. On first boot the manager automatically SSHs into the TS6 server,
# generates a WebQuery API key, and wires everything up. No manual steps.
#
# Optional: create a .env file to override any value below.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── TeamSpeak 6 Server ───────────────────────────────────────────────────
  teamspeak:
    image: teamspeaksystems/teamspeak6-server:latest
    container_name: ts6-server
    restart: unless-stopped
    environment:
      - TSSERVER_LICENSE_ACCEPTED=accept
      # Voice
      - TSSERVER_DEFAULT_PORT=9987
      # WebQuery HTTP (required by the manager)
      - TSSERVER_QUERY_HTTP_ENABLED=true
      - TSSERVER_QUERY_HTTP_PORT=10080
      # SSH ServerQuery (used on first boot to generate the WebQuery API key)
      - TSSERVER_QUERY_SSH_ENABLED=true
      - TSSERVER_QUERY_SSH_PORT=10022
      # serveradmin password — change this in production
      - TSSERVER_QUERY_ADMIN_PASSWORD=${TS_ADMIN_PASSWORD:-serveradmin}
      # File transfer
      - TSSERVER_FILE_TRANSFER_PORT=30033
    ports:
      - "${TS_VOICE_PORT:-9987}:9987/udp"    # Voice
      - "${TS_FT_PORT:-30033}:30033/tcp"     # File transfer
      - "${TS_WEBQUERY_PORT:-10080}:10080/tcp" # WebQuery (optional: remove to keep internal-only)
      - "${TS_SSH_PORT:-10022}:10022/tcp"    # SSH ServerQuery (optional: remove after first boot)
    volumes:
      - ts6-data:/var/tsserver
    networks:
      - ts6-network
    healthcheck:
      # Port 10080 accepting TCP = TS6 is up and WebQuery is ready
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/10080' 2>/dev/null && exit 0 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24        # wait up to 2 minutes for first boot
      start_period: 10s

  # ── TS6 Manager Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ts6-backend
    restart: unless-stopped
    depends_on:
      teamspeak:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/app/packages/backend/data/ts6webui.db
      # Change JWT_SECRET in production: openssl rand -hex 32
      - JWT_SECRET=${JWT_SECRET:-bundled-default-change-me-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - FRONTEND_URL=http://localhost:${MANAGER_PORT:-3000}
      - MUSIC_DIR=/data/music

      # ── Auto-provisioning — connects to TS6 on first boot to generate API key
      - TS_AUTOCONFIG_HOST=teamspeak
      - TS_AUTOCONFIG_HTTP_PORT=10080
      - TS_AUTOCONFIG_SSH_PORT=10022
      - TS_AUTOCONFIG_SSH_PASSWORD=${TS_ADMIN_PASSWORD:-serveradmin}
      - TS_AUTOCONFIG_NAME=${TS_SERVER_NAME:-My TeamSpeak Server}
    volumes:
      - backend-data:/app/packages/backend/data
      - music-data:/data/music
    ports:
      - "3001:3001"
    networks:
      - ts6-network

  # ── TS6 Manager Frontend (nginx) ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ts6-frontend
    restart: unless-stopped
    ports:
      - "${MANAGER_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - ts6-network

volumes:
  ts6-data:
  backend-data:
  music-data:

networks:
  ts6-network:
    driver: bridge
