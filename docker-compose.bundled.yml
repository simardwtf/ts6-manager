# docker-compose.bundled.yml
# ─────────────────────────────────────────────────────────────────────────────
# All-in-one stack: TeamSpeak 6 server + TS6 Manager (backend + frontend).
# Everything is pre-wired — just copy .env.bundled.example → .env and run:
#
#   docker compose -f docker-compose.bundled.yml up -d
#
# NOTE: Update the `teamspeak` image tag below to match whatever Docker image
# your TS6 distribution ships. The env vars shown assume the official TS6 image
# supports TS6_WEBQUERY_APIKEY; adjust if your build uses a different var name.
# ─────────────────────────────────────────────────────────────────────────────

version: '3.8'

services:

  # ── TeamSpeak 6 Server ───────────────────────────────────────────────────
  teamspeak:
    image: ${TS6_IMAGE:-teamspeak/teamspeak6-server:latest}
    container_name: ts6-server
    restart: unless-stopped
    environment:
      # Pre-configure the WebQuery API key so the manager can connect
      # automatically. Change this value in your .env file.
      - TS6_WEBQUERY_APIKEY=${TS_APIKEY:?TS_APIKEY must be set in .env}
      # Accept the license if required by your TS6 image:
      - TS6_LICENSE_ACCEPTED=${TS6_LICENSE_ACCEPTED:-accept}
    ports:
      - "${TS_VOICE_PORT:-9987}:9987/udp"   # Voice
      - "${TS_WEBQUERY_PORT:-10080}:10080"   # WebQuery HTTP (internal only if you prefer)
      - "${TS_SSH_PORT:-10022}:10022"        # ServerQuery SSH
    volumes:
      - ts6-data:/opt/ts6/data
    networks:
      - ts6-network
    healthcheck:
      # The /version endpoint requires no auth — good liveness signal
      test: ["CMD-SHELL", "curl -sf http://localhost:10080/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ── TS6 Manager Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ts6-backend
    restart: unless-stopped
    depends_on:
      teamspeak:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/app/packages/backend/data/ts6webui.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - FRONTEND_URL=http://localhost:3000
      - MUSIC_DIR=/data/music

      # ── Auto-seed the TS server connection on first boot ─────────────────
      - TS_AUTOCONFIG_HOST=teamspeak
      - TS_AUTOCONFIG_PORT=10080
      - TS_AUTOCONFIG_APIKEY=${TS_APIKEY}
      - TS_AUTOCONFIG_NAME=${TS_AUTOCONFIG_NAME:-My TeamSpeak Server}
      - TS_AUTOCONFIG_HTTPS=false
    volumes:
      - backend-data:/app/packages/backend/data
      - music-data:/data/music
    ports:
      - "3001:3001"
    networks:
      - ts6-network

  # ── TS6 Manager Frontend (nginx) ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ts6-frontend
    restart: unless-stopped
    ports:
      - "${MANAGER_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - ts6-network

volumes:
  ts6-data:
    driver: local
  backend-data:
    driver: local
  music-data:
    driver: local

networks:
  ts6-network:
    driver: bridge
